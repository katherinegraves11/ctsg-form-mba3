<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBA Student Submission Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background: linear-gradient(135deg, #A31F34 0%, #C41E3A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '★';
      position: absolute;
      font-size: 80px;
      color: rgba(255, 215, 0, 0.1);
      top: 10%;
      left: 5%;
      opacity: 0.3;
    }

    body::after {
      content: '★';
      position: absolute;
      font-size: 120px;
      color: rgba(255, 215, 0, 0.1);
      bottom: 10%;
      right: 5%;
      opacity: 0.3;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
      position: relative;
      z-index: 1;
    }

    h1 {
      color: #C41E3A;
      margin-bottom: 30px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }

    .tagline {
      display: none;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #C41E3A;
      box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn {
      background: linear-gradient(135deg, #A31F34 0%, #C41E3A 100%);
      color: #FFF8DC;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(196, 30, 58, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .reset-btn {
      background: #f0f0f0;
      color: #333;
    }

    .reset-btn:hover {
      background: #e0e0e0;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .required {
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MBA Student Submission Form</h1>
    <p class="subtitle">Send your questions to Katie (MBA rep) or Robbie (CTSG co-president).</p>

    <div id="message" class="message"></div>

    <form id="submissionForm">
      <div class="form-group">
        <label for="question">Your Question <span class="required">*</span></label>
        <textarea id="question" name="question" required></textarea>
      </div>

      <div class="form-group">
        <label for="recipient">Who is this for? <span class="required">*</span></label>
        <select id="recipient" name="recipient" required>
          <option value="">Select...</option>
          <option value="Katie">Katie</option>
          <option value="Robbie">Robbie</option>
          <option value="Both">Both</option>
        </select>
      </div>

      <div class="form-group">
        <label for="submitterName">Your Name <span class="required">*</span></label>
        <input type="text" id="submitterName" name="submitterName" required>
      </div>

      <div class="form-group">
        <label for="submitterEmail">Your Email <span class="required">*</span></label>
        <input type="email" id="submitterEmail" name="submitterEmail" required>
      </div>

      <div class="button-group">
        <button type="submit" class="submit-btn">Submit Question</button>
        <button type="reset" class="reset-btn">Clear</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('submissionForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = form.querySelector('.submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      const formData = {
        question: document.getElementById('question').value,
        recipient: document.getElementById('recipient').value,
        submitterName: document.getElementById('submitterName').value,
        submitterEmail: document.getElementById('submitterEmail').value,
      };

      try {
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(formData),
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.textContent = '✓ Question submitted successfully!';
          messageDiv.className = 'message success';
          form.reset();
          setTimeout(() => {
            messageDiv.style.display = 'none';
          }, 5000);
        } else {
          messageDiv.textContent = `Error: ${data.error}`;
          messageDiv.className = 'message error';
        }
      } catch (error) {
        messageDiv.textContent = 'Error submitting question. Please try again.';
        messageDiv.className = 'message error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Question';
      }
    });
  </script>
</body>
</html>
